project:
  type: website
  resources:
    - part-03/data
  post-render:
    - helpers/convert_pypercent.py
  render:
    - 404.qmd
    - index.qmd
    - introduction.qmd
    - general/*.qmd
    - part-01/*.qmd
    - part-02/*.qmd
    - part-03/*.qmd
website:
  favicon: images/favicon.svg
  title: "Optimization with Julia"
  repo-url: https://github.com/beyondsimulations/Optimization-with-Julia
  site-url: https://beyondsimulations.github.io/Optimization-with-Julia
  bread-crumbs: true
  sidebar:
    style: floating
    logo:
      light: images/course-logo.svg
      dark: images/course-logo-dark.svg
    logo-alt: "Optimization with Julia"
    collapse-level: 2
    search: true
    contents:
      - text: "Welcome"
        href: index.qmd
      - text: "Introduction"
        href: introduction.qmd
      - section: "I. First Steps"
        contents:
          - text: "01 - Variables"
            href: part-01/tutorial-01-01-variables.qmd
          - text: "02 - Vectors"
            href: part-01/tutorial-01-02-vectors.qmd
          - text: "03 - Comparisons"
            href: part-01/tutorial-01-03-comparisons.qmd
          - text: "04 - Loops"
            href: part-01/tutorial-01-04-loops.qmd
          - text: "05 - Dictionaries"
            href: part-01/tutorial-01-05-dicts.qmd
      - section: "II. Data"
        contents:
          - text: "01 - Functions"
            href: part-02/tutorial-02-01-functions.qmd
          - text: "02 - Packages"
            href: part-02/tutorial-02-02-handling.qmd
          - text: "03 - DataFrames"
            href: part-02/tutorial-02-03-DataFrames.qmd
          - text: "04 - Input and Output"
            href: part-02/tutorial-02-04-IO.qmd
          - text: "05 - Plotting"
            href: part-02/tutorial-02-05-Plotting.qmd
      - section: "III. Optimization"
        contents:
          - text: "01 - JuMP"
            href: part-03/tutorial-03-01-jump.qmd
          - text: "02 - Bounds"
            href: part-03/tutorial-03-02-bounds.qmd
          - text: "03 - Constraints"
            href: part-03/tutorial-03-03-constraints.qmd
          - text: "04 - Advanced"
            href: part-03/tutorial-03-04-advanced.qmd
          - text: "05 - Transport"
            href: part-03/tutorial-03-05-transport.qmd
      - section: "Cheatsheets"
        contents:
          - text: "Julia"
            href: general/cheatsheet-julia.qmd
          - text: "JuMP"
            href: general/cheatsheet-jump.qmd
      - text: "FAQs"
        href: general/faq.qmd
      - text: "Literature"
        href: general/literature.qmd

  page-footer:
    center: "Mathematical Optimization with Julia, Dr. Tobias Vlćek</br>CC BY-SA 4.0"
    left:
      - icon: github
        href: https://github.com/beyondsimulations/Optimization-with-Julia
        aria-label: GitHub repository
      - icon: linkedin
        href: https://linkedin.com/in/tobiasvlcek
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:vlcek@beyondsimulations.com
        aria-label: Email
      - icon: skip-backward
        href: https://tobiasvlcek.com/lectures/
        aria-label: All lectures
      - icon: shield-check
        href: general/privacy.qmd
        aria-label: Privacy policy
      - icon: info-circle
        href: general/imprint.qmd
        aria-label: Imprint

format:
  html:
    theme:
      light:
        - default
        - styles.scss
        - brand
      dark:
        - default
        - _dark.scss
        - styles.scss
        - brand
    respect-user-color-scheme: true
    toc: true
    syntax-highlighting:
      light: _paper-and-ink-light.theme
      dark: _paper-and-ink-dark.theme
    callout-appearance: simple
    code-copy: true
    code-link: true
    toc-location: right
    code-overflow: wrap
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    include-in-header:
      - general/header.html
      - general/favicon.html
    include-after-body:
      text: |
        <script defer src="https://oshu.eu/widget.js"></script>
        <script>
          document.addEventListener('DOMContentLoaded', function () {
            ChatWidget.init({
              tenant: "platform",
              agent: "optimization-julia",
              layoutMode: "sidebar",
            });
          });
        </script>

  typst:
    syntax-highlighting: _paper-and-ink-light.theme
    template-partials:
      - helpers/typst-show.typ
    logo:
      path: images/course-logo.svg
      alt: "Optimization with Julia"
    papersize: a4

execute:
  freeze: auto

engine: julia

filters:
  - helpers/typst-classes.lua
  - helpers/page-pauses.lua
